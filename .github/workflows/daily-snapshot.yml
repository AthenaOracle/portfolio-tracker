name: Daily portfolio snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-snapshot.yml'
      - 'scripts/nami_auto.py'
      - 'scripts/snapshot.py'
      - 'scripts/nami_preview.py'
      - 'scripts/nami_integration.py'
      - 'nami-positions.json'
      - 'data.json'
      - 'performance.json'
      - 'tests/test_nami_auto.py'
  # Daily at 4:30 PM New York time, 30 minutes after the regular
  # 4 PM Eastern stock-market close. GitHub schedules can start late.
  # Weekend/holiday wallet snapshots still occur, but the close-aligned
  # comparison uses only trading days with an actual dated S&P close.
  schedule:
    - cron: '30 16 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-snapshot-and-pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Nami rollover invariants
        run: python -m unittest discover -s tests -p 'test_nami_auto.py'

      - name: Build the daily snapshot
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          PORTFOLIO_CAPITAL_SOURCES_JSON: ${{ secrets.PORTFOLIO_CAPITAL_SOURCES_JSON }}
        run: python scripts/snapshot.py --force # Once per scheduled day; avoid 24h clock drift skipping a day
      - name: Build percentage performance and benchmarks
        env:
          PORTFOLIO_CASHFLOWS_JSON: ${{ secrets.PORTFOLIO_CASHFLOWS_JSON }}
        run: |
          if [ -n "$PORTFOLIO_CASHFLOWS_JSON" ]; then
            printf '%s' "$PORTFOLIO_CASHFLOWS_JSON" > cashflows.json
          fi
          python scripts/performance.py --force
      - name: Save history in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json performance.json nami-positions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily portfolio snapshot [skip ci]'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website only (exclude source and secrets)
        run: |
          mkdir -p site/examples
          cp index.html styles.css app.js config.json data.json performance.json site/
          cp examples/demo-data.json site/examples/
      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
